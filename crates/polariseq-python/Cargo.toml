[package]
name = "polariseq-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description.workspace = true

[lib]
name = "_polariseq"
crate-type = ["cdylib"]
# No Rust tests here (the tests are in Python), and a test binary of an extension module cannot link
# without the Python interpreter, which `cargo bench --no-run` and `cargo test --all` would try to build.
test = false
doctest = false
bench = false

[dependencies]
polariseq-core = { workspace = true }
polariseq-io = { workspace = true }
pyo3 = { workspace = true }
numpy = { workspace = true }
hdf5-metno = { workspace = true }
memmap2 = { workspace = true }
rayon = { workspace = true }
